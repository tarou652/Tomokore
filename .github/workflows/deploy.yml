name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "TomodachiHairTrace/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: TomodachiHairTrace/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: TomodachiHairTrace

      - name: Generate static site
        run: npx nuxi generate
        working-directory: TomodachiHairTrace
        env:
          NUXT_APP_BASE_URL: /Tomokore/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: TomodachiHairTrace/.output/public

      - uses: actions/deploy-pages@v4
        id: deployment
